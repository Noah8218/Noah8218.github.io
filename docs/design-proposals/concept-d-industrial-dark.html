<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Noah Choi - hero concept D (Industrial Monitor Dark), static mock</title>
<style>
/* Static concept mock for direction D. No external requests.
   FONT ASSUMPTION (not rendered here): production = Pretendard 500/700/800 (OFL 1.1) + JetBrains Mono 400/500/700 (OFL 1.1) as woff2 base64 or files.
   Measured in the user's deck (reference deck C original): Pretendard subset 174-178 KB per weight, JetBrains Mono subset 21 KB per weight.
   This mock renders with Windows system fonts as stand-ins: Segoe UI (for Pretendard) and Cascadia Mono / Consolas (for JetBrains Mono).
   Token names and values copied from the user's deck base.css (--bg0..--bg3, --line, --tx*, --mint/--blue/--amber/--red). */
:root{
  --bg0:#070B10;--bg1:#0D131A;--bg2:#141C25;--bg3:#1B2631;
  --line:rgba(148,163,184,.16);--line2:rgba(148,163,184,.34);
  --tx:#F3F5F7;--tx2:#AAB4C0;--tx3:#6B7785;
  --mint:#4ADE80;--blue:#60A5FA;--amber:#FBBF24;--red:#F87171;
  --mint-rgb:74,222,128;--blue-rgb:96,165,250;--amber-rgb:251,191,36;--red-rgb:248,113,113;
  --accent:var(--mint);--accent-rgb:var(--mint-rgb);
  --f-pd:PD,"Segoe UI Variable Display","Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-jb:JB,"Cascadia Mono",Consolas,"Malgun Gothic",monospace;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg0);color:var(--tx);-webkit-font-smoothing:antialiased}
body{width:1440px}
.hero{position:relative;width:1440px;height:900px;overflow:hidden;background:var(--bg0);font-family:var(--f-pd)}
/* background layer: two drifting glows + 18px dot grid (deck: glowdrift 20s, dots rgba(148,163,184,.07)) */
.glow{position:absolute;border-radius:50%}
.g1{width:900px;height:900px;left:-255px;top:-360px;background:radial-gradient(closest-side,rgba(var(--mint-rgb),.12),rgba(var(--mint-rgb),0))}
.g2{width:1050px;height:1050px;right:-315px;bottom:-480px;background:radial-gradient(closest-side,rgba(var(--mint-rgb),.09),rgba(var(--mint-rgb),0))}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(148,163,184,.07) 1px,transparent 1.5px);background-size:18px 18px;background-position:9px 9px}
.bar{position:absolute;left:0;top:0;height:2px;width:245px;background:var(--mint)}

/* header: mono kicker + 800 title (marker-band em) */
.kicker{position:absolute;left:80px;top:80px;display:flex;align-items:center;gap:12px;height:18px;font:500 15px/18px var(--f-jb);letter-spacing:.24em;text-transform:uppercase;color:var(--tx2);white-space:nowrap}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.16)}
.title{position:absolute;left:80px;top:112px;font:800 108px/1.1 var(--f-pd);letter-spacing:-.01em;color:var(--tx);white-space:nowrap}
.title em{font-style:normal;color:var(--accent);background:linear-gradient(rgba(var(--accent-rgb),.16),rgba(var(--accent-rgb),.16)) no-repeat 0 84%/100% 44%}
/* step tabs (numbered here because the mock text is limited to names; in production = section labels) */
.tabs{position:absolute;right:80px;top:62px;display:flex;gap:8px}
.pill{height:30px;min-width:46px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:999px;font:500 14px/1 var(--f-jb);letter-spacing:.06em;color:var(--tx3)}
.pill.past{color:var(--tx2);border-color:rgba(var(--mint-rgb),.6)}
.pill.on{background:var(--mint);border-color:var(--mint);color:var(--bg0);font-weight:700}
/* footer */
.mark{position:absolute;left:80px;top:846px;font:500 14px/16px var(--f-jb);letter-spacing:.12em;color:var(--tx3)}
.pg{position:absolute;right:80px;top:846px;font:500 14px/16px var(--f-jb);color:var(--tx3)}
.pg b{font-weight:500;color:var(--tx2)}

svg.scene{position:absolute;left:0;top:0}
.sig{fill:none;stroke:var(--line2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sig.m{stroke:rgba(var(--mint-rgb),.7);stroke-width:2}
.sig.b{stroke:rgba(var(--blue-rgb),.85);stroke-width:2}
.sig.a{stroke:rgba(var(--amber-rgb),.8);stroke-width:2;stroke-dasharray:3 8}
.card{fill:var(--bg2);stroke:var(--line);stroke-width:1}
.card.m{stroke:rgba(var(--mint-rgb),.5)}.card.a{stroke:rgba(var(--amber-rgb),.5)}.card.bl{stroke:rgba(var(--blue-rgb),.6)}
.cn{font:500 12px var(--f-jb);fill:var(--tx3);letter-spacing:.08em}
.ct{font:800 17px var(--f-pd);fill:var(--tx);letter-spacing:-.005em}
.ct.lg{font-size:21px}
.ic{fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:500 13px var(--f-jb);fill:var(--tx2);letter-spacing:.14em}
</style>
</head>
<body>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  function br(p,x,y,w,h,c,sw,l){var r=x+w,d=y+h;el('path',{d:'M'+x+' '+(y+l)+'V'+y+'H'+(x+l)+'M'+(r-l)+' '+y+'H'+r+'V'+(y+l)+'M'+r+' '+(d-l)+'V'+d+'H'+(r-l)+'M'+(x+l)+' '+d+'H'+x+'V'+(d-l),fill:'none',stroke:c,'stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round'},p)}

  [[936,292,70,40],[1022,292,44,40],[1126,292,80,40],[1230,292,70,40],[1120,356,50,44],[1190,356,110,44]].forEach(function(c){br(D,c[0]-5,c[1]-5,c[2]+10,c[3]+10,M,2.6,10)});
  br(D,931,351,70,54,'#F87171',3,11);
  el('rect',{x:931,y:407,width:30,height:14,rx:3,fill:'#F87171'},D);
  el('path',{d:'M941 410l10 8M951 410l-10 8',stroke:'#070B10','stroke-width':2,'stroke-linecap':'round'},D);
  /* cards */
  var C=document.getElementById('cards'),T={m:'74,222,128',a:'251,191,36'};
  var IC={
    '2d':'M3 8V4h4M17 4h4v4M21 16v4h-4M7 20H3v-4M12 9.2a2.8 2.8 0 1 0 .01 0',
    'lab':'M3 9h18V20H3zM3 9V3.5h8V9',
    '3d':'M12 2l9 5v10l-9 5-9-5V7zM12 12l9-5M12 12v10M12 12L3 7',
    'ms':'M3 3h18M5 3v9M19 3v9M12 3v4M9.5 7h5v4h-5zM4 15h16v5H4z',
    'sdk':'M9 3C6.5 3 6 4.5 6 6.5v2c0 1.5-1 2.5-2.5 3.5C5 13 6 14 6 15.5v2C6 19.5 6.5 21 9 21M15 3c2.5 0 3 1.5 3 3.5v2c0 1.5 1 2.5 2.5 3.5-1.5 1-2.5 2-2.5 3.5v2c0 2-.5 3.5-3 3.5'
  };
  function card(x,y,w,h,n,name,tone,ic,big){

  card(80,536,220,84,'04','Machine Studio','a','ms');

/* raw pixel grid inside the probe popover */
(function(){
  var NS='http://www.w3.org/2000/svg',g=document.getElementById('pxg'),tones=['#10233F','#1D3F70','#2F63A8','#60A5FA','#A9CCF9','#F3F5F7'],i,j,v,h,e;
  for(j=0;j<4;j++)for(i=0;i<5;i++){

</script>
